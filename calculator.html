/* ---------- Calculator tool ---------- */
    .tool-shell { max-width: 900px; margin-inline: auto; padding: clamp(1rem, 2.6vw, 1.6rem); background: var(--card); border: 1px solid var(--border); border-radius: 28px; box-shadow: var(--shadow); }

    /* Standard calculator */
    .calc-wrap { max-width: 380px; margin: 0 auto; }

    .key.eq { grid-column: span 2; color: #fff; background: linear-gradient(135deg, var(--key-eq-a), var(--key-eq-b)); border-color: transparent; box-shadow: 0 4px 0 rgba(0,0,0,.3), 0 8px 20px var(--ca-glow); }

    /* Percentage mode */

    /* EMI / loan mode */
    .emi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
    .emi-field label { display: flex; justify-content: space-between; margin-bottom: .35rem; font-size: .85rem; font-weight: 700; color: var(--muted); }

    .emi-field input[type="number"] { width: 100%; min-height: 46px; padding: .6rem .9rem; font-size: 1rem; outline: 0; background: var(--field); border: 1px solid var(--border-strong); border-radius: 12px; }

    .dot { width: 9px; height: 9px; border-radius: 50%; }
    .dot.p { background: var(--ca-a); }
    .dot.i { background: var(--ca-mint); }

    /* ---------- Content ---------- */
    .content { display: grid; gap: 1.2rem; padding: 2.5rem 0 3rem; }
    .content-card { padding: clamp(1.3rem, 3vw, 2rem); background: var(--card); border: 1px solid var(--border); border-radius: 20px; }

    .content-card ol { display: grid; gap: .8rem; counter-reset: step; }

    .faq { display: grid; gap: .7rem; }
